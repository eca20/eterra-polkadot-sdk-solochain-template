name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/free-disk-space
      - if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/ubuntu-dependencies
      - if: contains(matrix.os, 'macos')
        uses: ./.github/actions/macos-dependencies

      - name: Build the template
        run: cargo build
        timeout-minutes: 90

      - name: Run clippy
        run: |
          SKIP_WASM_BUILD=1 cargo clippy --all-targets --locked --workspace --quiet
          SKIP_WASM_BUILD=1 cargo clippy --all-targets --all-features --locked --workspace --quiet
        timeout-minutes: 30

      - name: Run the tests
        run: SKIP_WASM_BUILD=1 cargo test
        timeout-minutes: 15

      - name: Build the docs
        run: SKIP_WASM_BUILD=1 cargo doc --workspace --no-deps
        timeout-minutes: 15

  run-node:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/free-disk-space
      - if: contains(matrix.os, 'ubuntu')
        uses: ./.github/actions/ubuntu-dependencies
      - if: contains(matrix.os, 'macos')
        uses: ./.github/actions/macos-dependencies

      - name: Build the node individually in release mode
        run: cargo build --package solochain-eterra-node --release
        timeout-minutes: 90

      - name: Make sure the node is producing blocks
        run: |
          ./target/release/solochain-eterra-node --dev 2>&1 | tee out.txt &
          until curl -s '127.0.0.1:9944'; do sleep 5; done
          until cat out.txt | grep -s "Imported #2"; do sleep 5; done
        shell: bash
        timeout-minutes: 5

  deployment-pipeline:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [default, production]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space
      - uses: ./.github/actions/ubuntu-dependencies

      - name: Validate deployment pipeline (${{ matrix.mode }})
        run: ./scripts/deploy.sh pipeline-check ${{ matrix.mode }}
        timeout-minutes: 45

      - name: Run try-runtime gate (${{ matrix.mode }})
        run: ./scripts/deploy.sh try-runtime-check ${{ matrix.mode }}
        timeout-minutes: 45

      - name: Ensure strict production validation rejects placeholder spec
        if: matrix.mode == 'production'
        run: |
          set +e
          ./scripts/deploy.sh verify-production chain-specs/generated/production/production-plain.json
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Expected strict production validation to fail on placeholder built-in spec."
            exit 1
          fi
          echo "Strict production validator correctly rejected placeholder production spec."

      - name: Generate overrides from key material, finalize production spec, and validate
        if: matrix.mode == 'production'
        run: |
          set -euo pipefail
          k1="$(mktemp)"
          k2="$(mktemp)"
          p1="$(./target/debug/solochain-eterra-node key generate-node-key --chain dev --file "$k1" 2>&1 >/dev/null | tail -n1)"
          p2="$(./target/debug/solochain-eterra-node key generate-node-key --chain dev --file "$k2" 2>&1 >/dev/null | tail -n1)"

          cat > /tmp/eterra-production-keys-ci.json <<JSON
          {
            "name": "Eterra Production",
            "validators": [
              {
                "bootnode": "/dns4/validator-1.eterra.example/tcp/30333/p2p/${p1}",
                "aura_suri": "//Charlie",
                "grandpa_suri": "//Charlie",
                "grandpa_weight": 1
              },
              {
                "bootnode": "/dns4/validator-2.eterra.example/tcp/30333/p2p/${p2}",
                "aura_suri": "//Dave",
                "grandpa_suri": "//Dave",
                "grandpa_weight": 1
              }
            ],
            "sudo_suri": "//Eve",
            "faucet_suri": "//Eve",
            "initial_server_suris": [
              "//Charlie"
            ],
            "extra_endowed_suris": [
              "//Ferdie"
            ],
            "endowment": 1152921504606846976,
            "faucet_payout_amount": 1000000000000000
          }
          JSON

          ./scripts/generate-production-overrides.py --in /tmp/eterra-production-keys-ci.json --out /tmp/eterra-production-overrides-ci.json --node-bin ./target/debug/solochain-eterra-node
          ./scripts/deploy.sh finalize-production-spec production /tmp/eterra-production-overrides-ci.json /tmp/eterra-finalized-production-ci
          ./scripts/deploy.sh verify-production /tmp/eterra-finalized-production-ci/production-plain.json

  build-docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/free-disk-space

      - name: Build the Dockerfile
        run: docker build . -t polkadot-sdk-solochain-template
        timeout-minutes: 90
