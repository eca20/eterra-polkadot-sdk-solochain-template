[package]
name = "pallet-eterra-flow"
version = "0.1.0"
edition.workspace = true
license.workspace = true
authors.workspace = true
homepage.workspace = true
repository.workspace = true
description = "Eterra compatibility adapter for vendored Blockchainia Flow"

[dependencies]
pallet-blockchainia-flow = { path = "../../vendor/blockchainia-flow/crates/pallet-blockchainia-flow", default-features = false }

[dev-dependencies]
codec = { workspace = true, features = ["derive", "max-encoded-len"] }
eterra-manifest-builder = { package = "blockchainia-flow-manifest", path = "../../vendor/blockchainia-flow/crates/blockchainia-flow-manifest" }
frame-support = { workspace = true, features = ["std"] }
frame-system = { workspace = true, features = ["std"] }
hex = { workspace = true, features = ["std"] }
pallet-eterra-authority = { workspace = true, features = ["std"] }
pallet-eterra-economy = { workspace = true, features = ["std"] }
pallet-eterra-profile = { workspace = true, features = ["std"] }
scale-info = { workspace = true, features = ["std"] }
serde_json = { workspace = true, features = ["std"] }
sp-core = { workspace = true, features = ["std"] }
sp-io = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std"] }
sp-std = { workspace = true, features = ["std"] }

[features]
default = ["std"]
std = ["pallet-blockchainia-flow/std"]
runtime-benchmarks = ["pallet-blockchainia-flow/runtime-benchmarks"]
try-runtime = ["pallet-blockchainia-flow/try-runtime"]
