[package]
name = "pallet-eterra-simple-matchmaker"
version = "0.1.0"
edition = "2021"
authors = ["Eterra Devs"]
license = "Apache-2.0"

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
frame-support = { workspace = true, default-features = false }
frame-system  = { workspace = true, default-features = false }
pallet-alpha-access = { workspace = true, default-features = false }
frame-benchmarking = { workspace = true, default-features = false, optional = true }
frame-system-benchmarking = { workspace = true, default-features = false, optional = true }
parity-scale-codec = { workspace = true, features = ["derive", "max-encoded-len"] }
scale-info    = { workspace = true, features = ["derive"] }
sp-io         = { workspace = true, default-features = false }
sp-std        = { workspace = true, default-features = false }
sp-runtime    = { workspace = true, default-features = false }

[dev-dependencies]
sp-core    = { workspace = true }
sp-runtime = { workspace = true }

[features]
default = ["std"]
std = [
  "frame-support/std",
  "frame-system/std",
  "pallet-alpha-access/std",
  "frame-benchmarking?/std",
  "frame-system-benchmarking?/std",
  "sp-std/std",
  "sp-io/std",
  "sp-runtime/std",
]
runtime-benchmarks = [
  "frame-benchmarking/runtime-benchmarks",
  "frame-system-benchmarking/runtime-benchmarks",
  "frame-support/runtime-benchmarks",
  "frame-system/runtime-benchmarks",
  "pallet-alpha-access/runtime-benchmarks",
  "sp-runtime/runtime-benchmarks",
]
