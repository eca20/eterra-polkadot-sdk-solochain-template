[package]
name = "nexus-v2-migration-verifier"
description = "Offline copied-state V14/V15 to V16 Nexus migration verifier"
authors.workspace = true
edition.workspace = true
license.workspace = true
version.workspace = true
publish = false

[dependencies]
clap = { workspace = true, features = ["derive"] }
frame-remote-externalities.workspace = true
frame-support = { workspace = true, features = ["std", "try-runtime"] }
pallet-cryptostrike = { workspace = true, features = ["std", "try-runtime"] }
pallet-eterra-card-escrow = { workspace = true, features = ["std", "try-runtime"] }
pallet-eterra-game-authority = { workspace = true, features = ["std", "try-runtime"] }
pallet-eterra-tcg = { workspace = true, features = ["std", "try-runtime"] }
pallet-nfts = { workspace = true, features = ["std", "try-runtime"] }
parity-scale-codec = { workspace = true, features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = { workspace = true, features = ["std"] }
sha2.workspace = true
solochain-eterra-runtime = { workspace = true, features = ["std", "try-runtime"] }
sp-io = { workspace = true, features = ["std"] }
sp-runtime = { workspace = true, features = ["std", "try-runtime"] }
tokio = { version = "1.40", features = ["macros", "rt-multi-thread"] }
