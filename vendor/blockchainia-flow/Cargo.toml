[workspace]
members = [
    "crates/pallet-blockchainia-flow",
    "crates/blockchainia-flow-core",
    "crates/blockchainia-flow-manifest",
    "crates/blockchainia-flow-manifest-wasm",
]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT-0"
authors = ["Blockchainia"]
homepage = "https://blockchainia.us/flow"
repository = "https://github.com/blockchainia/blockchainia-flow"
rust-version = "1.81"

[workspace.dependencies]
base64 = "0.22"
blake2 = "0.10"
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive", "max-encoded-len"] }
frame-benchmarking = { version = "38.0.0", default-features = false }
frame-support = { version = "38.0.0", default-features = false, features = ["experimental"] }
frame-system = { version = "38.0.0", default-features = false }
hex = "0.4"
scale-info = { version = "2.11.1", default-features = false, features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sp-core = { version = "34.0.0", default-features = false }
sp-io = { version = "38.0.0", default-features = false }
sp-runtime = { version = "39.0.1", default-features = false }
sp-std = { version = "14.0.0", default-features = false }
wasm-bindgen = "0.2"
