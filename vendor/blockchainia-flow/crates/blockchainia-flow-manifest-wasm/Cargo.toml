[package]
name = "blockchainia-flow-manifest-wasm"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT-0"
authors = ["Blockchainia"]
homepage = "https://blockchainia.us/flow"
repository = "https://github.com/blockchainia/blockchainia-flow"
rust-version = "1.81"
description = "WASM compiler boundary for Blockchainia Flow v0 manifests"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
blockchainia-flow-manifest = { path = "../blockchainia-flow-manifest" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
wasm-bindgen = "0.2"
