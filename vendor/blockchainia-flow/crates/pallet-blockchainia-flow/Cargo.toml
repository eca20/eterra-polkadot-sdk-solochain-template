[package]
name = "pallet-blockchainia-flow"
version = "0.1.0-alpha.1"
edition = "2021"
license = "MIT-0"
authors = ["Blockchainia"]
homepage = "https://blockchainia.us/flow"
repository = "https://github.com/blockchainia/blockchainia-flow"
rust-version = "1.81"
description = "Runtime-authoritative bounded Flow v0 state-transition pallet"

[dependencies]
codec = { package = "parity-scale-codec", version = "3.6.12", default-features = false, features = ["derive", "max-encoded-len"] }
scale-info = { version = "2.11.1", default-features = false, features = ["derive"] }
frame-support = { version = "38.0.0", default-features = false, features = ["experimental"] }
frame-system = { version = "38.0.0", default-features = false }
frame-benchmarking = { version = "38.0.0", default-features = false, optional = true }
sp-runtime = { version = "39.0.1", default-features = false }
sp-std = { version = "14.0.0", default-features = false }

[dev-dependencies]
sp-core = { version = "34.0.0" }
sp-io = { version = "38.0.0" }

[features]
default = ["std"]
std = [
    "codec/std",
    "scale-info/std",
    "frame-support/std",
    "frame-system/std",
    "frame-benchmarking?/std",
    "sp-runtime/std",
    "sp-std/std",
]
runtime-benchmarks = [
    "frame-benchmarking/runtime-benchmarks",
    "frame-support/runtime-benchmarks",
    "frame-system/runtime-benchmarks",
    "sp-runtime/runtime-benchmarks",
]
try-runtime = ["frame-support/try-runtime"]
