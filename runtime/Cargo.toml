[package]
name = "solochain-eterra-runtime"
description = "A solochain runtime built with Substrate for the Eterra chain"
version = "0.1.0"
license = "Unlicense"
authors.workspace = true
homepage.workspace = true
repository.workspace = true
edition.workspace = true
publish = false

[package.metadata.docs.rs]
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
codec = { features = [
	"derive",
], workspace = true }
scale-info = { features = [
	"derive",
	"serde",
], workspace = true }
frame-support = { features = ["experimental"], workspace = true }
frame-system.workspace = true
frame-try-runtime = { optional = true, workspace = true }
frame-executive.workspace = true
frame-metadata-hash-extension.workspace = true
pallet-aura.workspace = true
pallet-assets.workspace = true
pallet-balances.workspace = true
pallet-collective.workspace = true
pallet-grandpa.workspace = true
pallet-membership.workspace = true
pallet-node-authorization.workspace = true
pallet-sudo.workspace = true
pallet-timestamp.workspace = true
pallet-treasury.workspace = true
pallet-transaction-payment.workspace = true
sp-api.workspace = true
sp-block-builder.workspace = true
sp-consensus-aura = { features = ["serde"], workspace = true }
sp-consensus-grandpa = { features = ["serde"], workspace = true }
sp-core = { features = ["serde"], workspace = true }
sp-inherents.workspace = true
sp-io.workspace = true
sp-offchain.workspace = true
sp-runtime = { features = ["serde"], workspace = true }
sp-session.workspace = true
sp-storage.workspace = true
sp-transaction-pool.workspace = true
sp-version = { features = ["serde"], workspace = true }
sp-genesis-builder.workspace = true
frame-system-rpc-runtime-api.workspace = true
pallet-transaction-payment-rpc-runtime-api.workspace = true
frame-benchmarking = { optional = true, workspace = true }
frame-system-benchmarking = { optional = true, workspace = true }

# Local Dependencies
pallet-eterra                             = { workspace = true }
pallet-eterra-tcg = { workspace = true }
pallet-eterra-gamer = { workspace = true }
pallet-eterra-media = { workspace = true }
pallet-eterra-seasons = { workspace = true }
pallet-nfts = { workspace = true }
pallet-eterra-daily-slots = { workspace = true }
pallet-eterra-simple-matchmaker = { workspace = true }
pallet-eterra-faucet = { workspace = true }
pallet-eterra-monte-carlo-ai = { workspace = true }
pallet-eterra-game-authority = { workspace = true }
pallet-eterra-card-escrow = { workspace = true }
pallet-eterra-authority = { workspace = true }
pallet-eterra-economy = { workspace = true }
pallet-eterra-flow = { workspace = true }
pallet-eterra-profile = { workspace = true }
pallet-eterra-arcade-core = { workspace = true }
pallet-eterra-arcade-ouro = { workspace = true }
pallet-eterra-arcade-aegis-run = { workspace = true }
pallet-alpha-access = { workspace = true }
